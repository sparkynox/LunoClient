name: LunoClient CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      LUNO_KEYSTORE_PASSWORD: ${{ secrets.LUNO_KEYSTORE_PASSWORD }}
      LUNO_KEY_ALIAS: ${{ secrets.LUNO_KEY_ALIAS }}
      LUNO_KEY_PASSWORD: ${{ secrets.LUNO_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - name: Decode release keystore
        run: |
          echo "${{ secrets.LUNO_KEYSTORE_BASE64 }}" | base64 -d > app_pojavlauncher/luno_release.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Diagnose glfw:jni_bindings
        run: |
          gradle :glfw:jni_bindings:tasks --stacktrace --info --warning-mode all > glfw_diag.log 2>&1 || true
          echo "===TASKS DONE, NOW TRYING ASSEMBLE===" >> glfw_diag.log
          gradle :glfw:jni_bindings:assembleRelease --stacktrace --info >> glfw_diag.log 2>&1 || true
          tail -150 glfw_diag.log

      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: glfw-diag-log
          path: glfw_diag.log

      - name: Build Release APK
        run: |
          gradle :app_pojavlauncher:assembleFullRelease --stacktrace
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/LunoClient-release-full.apk

      - name: Build Release APK (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeRelease
          mv app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk out/LunoClient-release-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/LunoClient-release-full.apk > out/LunoClient-release-full.md5
          md5sum out/LunoClient-release-noruntime.apk > out/LunoClient-release-noruntime.md5

      - name: Clean up keystore
        if: always()
        run: rm -f app_pojavlauncher/luno_release.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LunoClient-release
          path: out/LunoClient-release-full.apk

      - name: Upload Release APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: LunoClient-release-noruntime
          path: out/LunoClient-release-noruntime.apk
